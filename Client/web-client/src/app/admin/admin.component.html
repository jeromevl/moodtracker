<div class="admin-container">
    <div class="admin-header">
        <h2>Admin Dashboard</h2>
        <button class="btn-logout" (click)="onLogout()">
            Logout
        </button>
    </div>

    <div *ngIf="isLoading" class="loading-state">Loading mood logs...</div>
    <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

    <!-- Filters Bar -->
    <div *ngIf="!isLoading" class="filter-bar">
        <input type="text" placeholder="Filter by username..." [(ngModel)]="searchTerm"
            (ngModelChange)="onFilterChange()" />

        <input type="date" [(ngModel)]="selectedDate" (ngModelChange)="onFilterChange()" />

        <button (click)="clearFilters()" [disabled]="!searchTerm && !selectedDate">Clear Filters</button>
    </div>

    <!-- Table -->
    <table *ngIf="!isLoading && paginatedMoods.length > 0" class="mood-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Username</th>
                <th>Recorded Mood</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let entry of paginatedMoods">
                <td>{{ entry.date | date:'mediumDate' }}</td>
                <td>{{ entry.username }}</td>
                <td>
                    <span class="mood-badge" [ngClass]="getMoodClass(entry.mood)">
                        {{ entry.mood }}
                    </span>
                </td>
                <td>{{ entry.remarks }}</td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination Controls -->
    <div *ngIf="!isLoading && filteredMoods.length > 0" class="pagination-controls">
        <button (click)="prevPage()" [disabled]="currentPage === 1">Previous</button>
        <span>Page {{ currentPage }} of {{ totalPages }}</span>
        <button (click)="nextPage()" [disabled]="currentPage === totalPages">Next</button>
    </div>

    <p *ngIf="!isLoading && filteredMoods.length === 0" class="no-data">No mood entries found.</p>
</div>
