<div class="mood-container">
    <h2>Daily Team Mood Tracker</h2>

    <!-- Error & Success Alerts -->
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>
    <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
        <fieldset [disabled]="status !== 'entry'" class="form-fieldset">
            <div class="form-group">
                <label for="username">Your Username:</label>
                <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username"
                    placeholder="e.g. Jerome" autofocus required />
            </div>

            <div class="form-group">
                <label>How are you feeling today?</label>
                <div *ngFor="let option of moodOptions" class="mood-option">
                    <label>
                        <input type="radio" [value]="option.value" [(ngModel)]="selectedMoodId" name="moodOption" />
                        {{ option.label }}
                    </label>
                </div>
            </div>

            <!-- Remarks -->
            <div class="form-group">
                <label for="remarks">Remarks (Optional):</label>
                <textarea id="remarks" class="form-control textarea-control" [(ngModel)]="remarks" name="remarks"
                    rows="3" placeholder="Any additional thoughts or details..."></textarea>
            </div>
        </fieldset>

        <div class="button-group">
            <button type="submit" class="btn-submit" [disabled]="status !== 'entry'">
                {{ status === 'submitting' ? 'Submitting...' : 'Submit Mood' }}
            </button>

            <button type="button" class="btn-clear" (click)="onClear()">
                Clear
            </button>
        </div>
    </form>
</div>
